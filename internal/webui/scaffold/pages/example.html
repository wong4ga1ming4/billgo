<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>示例页面</title>
  <style>
    body { font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 40px; color: #1f2328; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
    .box { border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px 20px; max-width: 720px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>这是 Agent 的示例页面</h1>
    <p>这个文件在数据目录的 <code>pages/</code> 下，主页面的链接会自动出现。</p>
    <p>当前时间：<span id="clock">-</span></p>
    <p>从这里可以调用同源接口，比如读取本节点信息：</p>
    <pre id="node">加载中…</pre>
  </div>
  <script>
    document.getElementById("clock").textContent = new Date().toLocaleString();
    fetch("/api/node", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        document.getElementById("node").textContent = JSON.stringify(data, null, 2);
      })
      .catch(function (e) {
        document.getElementById("node").textContent = String(e);
      });
  </script>
</body>
</html>
