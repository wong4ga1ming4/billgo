# 本机页面默认只监听容器内的 127.0.0.1:7878。
# 需要从宿主机打开时，给对应服务加端口映射（只发布到回环）：
#   ports: ["127.0.0.1:7878:7878"]
# 多个服务不能映射同一个宿主端口；Agent 页面在 /data/www/pages，
# 需要时可以把宿主机目录挂到那里。
name: billgo

services:
  banana:
    build:
      context: ..
    volumes:
      - ./conf/banana.json:/etc/billgo/config.json:ro
      - banana-data:/data

  apple:
    build:
      context: ..
    volumes:
      - ./conf/apple.json:/etc/billgo/config.json:ro
      - apple-data:/data

  peach:
    build:
      context: ..
    volumes:
      - ./conf/peach.json:/etc/billgo/config.json:ro
      - peach-data:/data

volumes:
  banana-data:
  apple-data:
  peach-data:
