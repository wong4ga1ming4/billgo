# billui 默认只监听容器内的 127.0.0.1:7878。密码在容器日志和 /data/billui.password。
# 需要从宿主机打开时，给对应服务加端口映射，并设 BILLUI_LISTEN=0.0.0.0:7878：
#   ports: ["127.0.0.1:7878:7878"]
#   environment: ["BILLUI_LISTEN=0.0.0.0:7878"]
# 多个服务不能映射同一个宿主端口。BILLUI=0 时不启动页面。
name: billgo

services:
  banana:
    build:
      context: ..
    volumes:
      - ./conf/banana.json:/etc/billgo/config.json:ro
      - banana-data:/data

  apple:
    build:
      context: ..
    volumes:
      - ./conf/apple.json:/etc/billgo/config.json:ro
      - apple-data:/data

  peach:
    build:
      context: ..
    volumes:
      - ./conf/peach.json:/etc/billgo/config.json:ro
      - peach-data:/data

volumes:
  banana-data:
  apple-data:
  peach-data:
